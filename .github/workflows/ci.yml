name: DevOps Automated Pipeline
# Trigger this pipeline on every git push to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download our code onto GitHub's runner machine
      - name: Checkout Code
        uses: actions/checkout@v4
      # Step 2: Set up Python runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Step 3: Run our automated unit tests (Continuous Integration)
      - name: Run Unit Tests
        run: |
          echo "Running unit tests..."
          python -m unittest test_app.py
      # Step 4: Build the Docker Image (Continuous Delivery packaging)
      - name: Build Docker Image
        run: |
          echo "Building Docker Image..."
          docker build -t my-devops-app:${{ github.sha }} .
      - name: Pipeline Success
        run: echo " CI/CD Pipeline Passed Successfully!"
