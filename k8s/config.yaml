apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: "production"
  PORT: "5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  # Kubernetes automatically encodes stringData into base64 for you
  API_SECRET_KEY: "super-secret-jwt-token-9988"
