apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-microservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/deeputhinks/devops.git'
    targetRevision: HEAD
    path: charts/devops-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
